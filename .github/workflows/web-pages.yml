# The browser version (web/): tested and built on every push that touches
# it, and published to GitHub Pages — the built site in web/dist, never the
# repository itself (whose index.json would then be the home page) — from
# the default branch or from the branch the browser version is made on.
name: Web (GitHub Pages)

on:
  push:
    paths: ['web/**', '.github/workflows/web-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npx vite build
      # The games as they are on the default branch (where the iPads read
      # them), published with the site: the page reads a game from here when
      # it is unchanged on GitHub, and from GitHub when it has changed since.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: catalogue-source
          sparse-checkout: |
            games
            lib
      - name: Copy the games into the site
        run: |
          mkdir -p dist/catalogue
          cp ../catalogue-source/index.json dist/catalogue/
          cp -R ../catalogue-source/games ../catalogue-source/lib dist/catalogue/
          rm -rf ../catalogue-source
          du -sh dist dist/catalogue
          test -s dist/index.html && test -s dist/catalogue/index.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      # Publishing needs Pages switched on once (Settings → Pages → Source:
      # GitHub Actions). Until then the site is built and tested, not published.
      - name: Is Pages on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not switched on yet: Settings → Pages → Source: GitHub Actions."
          fi

  deploy:
    needs: build
    if: >-
      needs.build.outputs.pages == 'true' &&
      (github.ref_name == github.event.repository.default_branch || github.ref_name == 'claude/ablox-ipad-platform-8e8d8m')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
